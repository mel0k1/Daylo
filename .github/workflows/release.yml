name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Зависимости Tauri для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Daylo v__VERSION__
          releaseBody: |
            **Изменено**
            - Атмосферный фон: ступенчатое «небо» сверху, затемнение над панелью и медленные пиксель-частицы, поднимающиеся снизу вверх (отключаются при системной настройке «уменьшить движение»)
            - Жёлтый сплэш у логотипа: случайная фраза на каждый запуск, пульсирует под углом — как на титульном экране игры
            - Травяная полоса во всю ширину над нижней панелью — верхний срез блока травы
            - Кнопка «Играть» в верхнем баре стала главной: зелёная и крупнее
            - Карточки приподнимаются при наведении (пиксельным сдвигом), у заголовков секций библиотеки — цветные слот-буллеты, в пустых состояниях — крестик «слот без предмета»

            Скачайте установщик под свою систему. Обновление лаунчера подтянется само.
          releaseDraft: false
          prerelease: false
