name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Зависимости Tauri для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Daylo v__VERSION__
          releaseBody: |
            **Добавлено**
            - Новый главный экран: библиотека сборок и скачанных версий, сверху — ник, выбор версии и «Играть»; навигация переехала в нижнюю панель
            - Иконки у пунктов нижней панели
            - Мультиаккаунт: несколько профилей (оффлайн, Ely.by, Microsoft) с переключением в настройках
            - «Проверить файлы» у сборки: битые файлы находятся по хешам и перекачиваются, удалённые моды восстанавливаются
            - Удаление скачанных версий из библиотеки (запущенную версию удалить нельзя)
            - ИИ-сборщик сборок на бесплатном шлюзе, бэкапы миров с восстановлением

            **Изменено**
            - Мягкая остановка игры: мир успевает сохраниться, остановленная игра больше не показывает краш-модал
            - Батч-обновления модов — в разы меньше запросов, добавлены таймауты сети и зеркала для скачивания Java
            - Размер и полноэкранный режим окна игры настраиваются в настройках
            - Очистка временного кэша при старте, ротация лога последнего запуска
            - Валидация ника, защита от повторного запуска лаунчера, восстановление интерфейса после падения

            Скачайте установщик под свою систему. Обновление лаунчера подтянется само.
          releaseDraft: false
          prerelease: false
