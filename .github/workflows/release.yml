name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Зависимости Tauri для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Daylo v__VERSION__
          releaseBody: |
            **Исправлено**
            - Поиск на Modrinth снова работает: фильтры отправляются в формате, который принимает API (сервер отвечал 400 Bad Request)
            - Если Modrinth ещё не знает свежую версию игры, поиск выполняется без фильтра версии — вместо пустой ошибки
            - CurseForge: ключ API теперь подключается к официальному API напрямую (зеркало недоступно части сетей), сообщения об ошибках стали понятнее
            - ИИ-сборщик: повторные попытки при сбоях шлюза (лимит, перегрузка, сеть), внятные тексты ошибок, разбор ответов reasoning-моделей — «пустой ответ» больше не срывает генерацию

            Скачайте установщик под свою систему. Обновление лаунчера подтянется само.
          releaseDraft: false
          prerelease: false
