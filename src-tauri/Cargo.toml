[package]
name = "daylo"
version = "0.1.0"
description = "Daylo — лаунчер Minecraft"
authors = ["mel0k1"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "daylo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
strip = true
lto = true
