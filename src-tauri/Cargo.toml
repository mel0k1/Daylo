[package]
name = "daylo"
version = "0.1.0"
description = "Daylo — лаунчер Minecraft"
authors = ["mel0k1"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "daylo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "charset", "http2", "gzip"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
base64 = "0.22"

[profile.release]
strip = true
lto = true
